<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal - MyCRM</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>
    <div class="container">
        <div class="page-header">
            <h1 id="pageTitle">Add Deal</h1>
        </div>
        <div class="card form-page" style="padding:32px">
            <form id="dealForm">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="title" required placeholder="Deal title">
                </div>
                <div class="form-group">
                    <label>Value ($)</label>
                    <input type="number" id="value" placeholder="0" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Open">Open</option>
                        <option value="Won">Won</option>
                        <option value="Lost">Lost</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Contact</label>
                    <select id="contact_id">
                        <option value="">-- Select Contact --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" placeholder="Additional notes..."></textarea>
                </div>
                <div class="form-actions">
                    <a href="deals.html" class="btn-secondary">Cancel</a>
                    <button type="submit" class="btn-primary">Save Deal</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        if (!Auth.guard()) {}
        renderNavbar('deals');

        const urlParams = new URLSearchParams(window.location.search);
        const dealId = urlParams.get('id');
        const isEdit = !!dealId;

        document.getElementById('pageTitle').textContent = isEdit ? 'Edit Deal' : 'Add Deal';

        async function loadContacts() {
            try {
                const data = await api('/api/contacts?per_page=1000');
                const select = document.getElementById('contact_id');
                (data.items || []).forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.name;
                    select.appendChild(opt);
                });
            } catch (e) {}
        }

        async function loadDeal() {
            if (!isEdit) return;
            showLoading(true);
            try {
                const d = await api(`/api/deals/${dealId}`);
                document.getElementById('title').value = d.title || '';
                document.getElementById('value').value = d.value || 0;
                document.getElementById('status').value = d.status || 'Open';
                document.getElementById('contact_id').value = d.contact_id || '';
                document.getElementById('notes').value = d.notes || '';
            } catch (e) {} finally { showLoading(false); }
        }

        document.getElementById('dealForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoading(true);
            const body = {
                title: document.getElementById('title').value,
                value: parseFloat(document.getElementById('value').value) || 0,
                status: document.getElementById('status').value,
                contact_id: document.getElementById('contact_id').value || null,
                notes: document.getElementById('notes').value || null
            };
            try {
                if (isEdit) {
                    await api(`/api/deals/${dealId}`, { method: 'PUT', body });
                    showToast('Deal updated', 'success');
                } else {
                    await api('/api/deals', { method: 'POST', body });
                    showToast('Deal created', 'success');
                }
                setTimeout(() => window.location.href = 'deals.html', 600);
            } catch (e) { showLoading(false); }
        });

        loadContacts().then(() => loadDeal());
    </script>
</body>
</html>
