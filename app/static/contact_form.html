<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - MyCRM</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>
    <div class="container">
        <div class="page-header">
            <h1 id="pageTitle">Add Contact</h1>
        </div>
        <div class="card form-page" style="padding:32px">
            <form id="contactForm">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone" placeholder="555-1234">
                </div>
                <div class="form-group">
                    <label>Company</label>
                    <input type="text" id="company" placeholder="Acme Inc">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" placeholder="Additional notes..."></textarea>
                </div>
                <div class="form-actions">
                    <a href="contacts.html" class="btn-secondary">Cancel</a>
                    <button type="submit" class="btn-primary">Save Contact</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        if (!Auth.guard()) {}
        renderNavbar('contacts');

        const urlParams = new URLSearchParams(window.location.search);
        const contactId = urlParams.get('id');
        const isEdit = !!contactId;

        document.getElementById('pageTitle').textContent = isEdit ? 'Edit Contact' : 'Add Contact';

        async function loadContact() {
            if (!isEdit) return;
            showLoading(true);
            try {
                const c = await api(`/api/contacts/${contactId}`);
                document.getElementById('name').value = c.name || '';
                document.getElementById('email').value = c.email || '';
                document.getElementById('phone').value = c.phone || '';
                document.getElementById('company').value = c.company || '';
                document.getElementById('notes').value = c.notes || '';
            } catch (e) {} finally { showLoading(false); }
        }

        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoading(true);
            const body = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value || null,
                phone: document.getElementById('phone').value || null,
                company: document.getElementById('company').value || null,
                notes: document.getElementById('notes').value || null
            };
            try {
                if (isEdit) {
                    await api(`/api/contacts/${contactId}`, { method: 'PUT', body });
                    showToast('Contact updated', 'success');
                } else {
                    await api('/api/contacts', { method: 'POST', body });
                    showToast('Contact created', 'success');
                }
                setTimeout(() => window.location.href = 'contacts.html', 600);
            } catch (e) { showLoading(false); }
        });

        loadContact();
    </script>
</body>
</html>
